name: Dependabot Lockfile Auto-Fix

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  fix-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update bun.lockb for dependabot bump"
